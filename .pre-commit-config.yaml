default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: branch-name
        name: branch name is <type>/<kebab-summary>
        entry: >-
          bash -c 'b=$(git branch --show-current);
          [[ -z $b || $b == main || $b =~ ^(feat|fix|refactor|perf|test|docs|build|ci|chore|style|revert)/[a-z0-9]+(-[a-z0-9]+)*$ ]]
          || { echo "Branch \"$b\" must be <type>/<kebab-summary>, e.g. feat/12-frost-alerts"; exit 1; }'
        language: system
        always_run: true
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
