x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+asyncpg://agrobot:agrobot@db:5432/agrobot
    API_KEY: dev-api-key
    TIMEZONE: America/Argentina/Buenos_Aires
    LOG_LEVEL: INFO
    INGEST_INTERVAL_SECONDS: 60
    INGEST_TIME_LIMIT_SECONDS: 60
    EVALUATE_INTERVAL_SECONDS: 30
    EVALUATE_TIME_LIMIT_SECONDS: 30
    NOTIFY_INTERVAL_SECONDS: 10
    NOTIFY_TIME_LIMIT_SECONDS: 30
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

x-worker-healthcheck: &worker-healthcheck
  interval: 15s
  timeout: 10s
  retries: 3
  start_period: 60s

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: agrobot
      POSTGRES_PASSWORD: agrobot
      POSTGRES_DB: agrobot
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrobot -d agrobot"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    <<: *app
    command: ["python", "-m", "agrobot.worker", "ingest"]
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "agrobot.worker", "check", "ingest"]

  evaluate:
    <<: *app
    command: ["python", "-m", "agrobot.worker", "evaluate"]
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "agrobot.worker", "check", "evaluate"]

  notify:
    <<: *app
    command: ["python", "-m", "agrobot.worker", "notify"]
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "agrobot.worker", "check", "notify"]

volumes:
  pgdata:
