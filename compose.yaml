name: agrobot

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: agrobot
      POSTGRES_PASSWORD: agrobot
      POSTGRES_DB: agrobot
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrobot -d agrobot"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
